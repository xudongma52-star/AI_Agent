server:
  port: 10002

spring:
  application:
    name: spring-ai-alibaba-qwq-chat-client-example
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 生产者确认模式
    publisher-confirm-type: correlated
    publisher-returns: true

    listener:
      simple:
        # 手动ACK，消费失败不丢消息
        acknowledge-mode: manual
        # 消费失败重试
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_agent
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  ai:
    dashscope:
      api-key: sk-395fd22a76a5496099044ce1a13e9847
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3    # 最新模型，1024维

    ollama:
      base-url: http://localhost:11434
      embedding:
        enabled: false            # 禁用Ollama Embedding，统一用DashScope
      chat:
        options:
          model: qwen3.6          # 本地模型，专家Agent专用
          temperature: 0.7
          num-ctx: 8192

    vectorstore:
      pgvector:
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true

rag:
  enabled: true
  document-path: "classpath:documents/*.md"
  chunk-size: 800
  chunk-overlap: 200
  topK: 5
  similarity-threshold: 0.70

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.max.ai_agent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

chat:
  memory:
    redis-ttl: 3600
    max-size: 100