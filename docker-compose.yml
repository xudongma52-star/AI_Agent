services:
  # ──────────── 基础设施 ────────────

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_agent
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ai_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────── Ollama（可选）────────────
  # 主对话使用 DashScope 云端模型，不受影响。
  # 专家子 Agent（老子/阳明/典籍检索）需要此服务。

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 自动拉取本地模型（只需执行一次）
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "拉取本地模型 qwen3.6（可能需要几分钟）..."
        ollama pull qwen3.6
        echo "模型就绪。"
    environment:
      OLLAMA_HOST: ollama:11434

  # ──────────── 应用 ────────────

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "10002:10002"
    environment:
      # 服务发现：覆盖 localhost → 容器名
      DB_URL: jdbc:postgresql://postgres:5432/ai_agent
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      OLLAMA_BASE_URL: http://ollama:11434
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}

  # ──────────── 前端 ────────────

  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"
    profiles:
      - frontend

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  ollamadata:
